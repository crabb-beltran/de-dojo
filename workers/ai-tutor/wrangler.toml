name = "de-lab-ai-tutor"
main = "worker.js"
compatibility_date = "2024-11-01"

# RECOMMENDED: lock CORS to your site origin instead of "*" so only your
# deployed app can call the tutor. Uncomment and set your Pages origin:
[vars]
ALLOW_ORIGIN = "https://crabb-beltran.github.io"
# MODEL = "claude-sonnet-4-6"
GEMINI_MODEL = "gemini-2.5-flash"

# Set the API keys as secrets (never commit them):
#   wrangler secret put ANTHROPIC_API_KEY   # powers action:'tutor' (hint/review)
#   wrangler secret put GEMINI_API_KEY      # powers action:'grade' and 'recommend'
#
# GEMINI_API_KEY comes from Google AI Studio (https://aistudio.google.com/apikey),
# NOT from a consumer Gemini Pro/Advanced app subscription — those are separate.
#
# GEMINI_MODEL above must exist and be enabled for your key — verify current
# names/pricing at https://ai.google.dev/gemini-api/docs/pricing before relying
# on the default; model availability changes over time.
